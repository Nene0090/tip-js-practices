<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Практическая работа № 4 — Задачи</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>Список задач</h1>
    <p class="page-subtitle">ПР4: формы, валидация и localStorage</p>
  </header>

  <main class="page-main">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Добавление задачи</h2>

      <form id="task-form" novalidate>
        <div class="field">
          <label for="task-id">Идентификатор</label>
          <input
            id="task-id"
            name="id"
            type="number"
            min="1"
            step="1"
            required
            autocomplete="off"
          />
          <p class="field-error" data-error-for="id"></p>
        </div>

        <div class="field">
          <label for="task-title">Название</label>
          <input
            id="task-title"
            name="title"
            type="text"
            maxlength="100"
            required
            autocomplete="off"
          />
          <p class="field-error" data-error-for="title"></p>
        </div>

        <div class="field">
          <label for="task-priority">Приоритет</label>
          <select id="task-priority" name="priority" required>
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
          <p class="field-error" data-error-for="priority"></p>
        </div>

        <div class="form-actions">
          <button type="submit">Добавить задачу</button>
          <button type="button" id="form-cancel" hidden>Отменить</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="filters-title">
      <h2 id="filters-title">Фильтры</h2>
      <div id="task-filters" class="filters" role="group" aria-label="Фильтр задач">
        <button type="button" data-filter="all" class="is-active" aria-pressed="true">Все</button>
        <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
        <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="summary-title">
      <h2 id="summary-title">Сводка</h2>
      <div id="task-summary" class="summary">
        <p>Всего: <span data-stat="total">0</span></p>
        <p>Выполнено: <span data-stat="completed">0</span></p>
        <p>Осталось: <span data-stat="pending">0</span></p>
        <p>Прогресс: <span data-stat="progress">0.0%</span></p>
        <p>Видимых: <span data-stat="visible">0</span></p>
      </div>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Задачи</h2>
      <p id="operation-message" class="operation-message" hidden></p>
      <p id="empty-message" class="empty-message" hidden></p>
      <ul id="task-list" class="task-list"></ul>
    </section>

    <section class="panel" aria-labelledby="storage-title">
      <h2 id="storage-title">Хранилище</h2>
      <button type="button" id="storage-reset">Сбросить сохранённые данные</button>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
